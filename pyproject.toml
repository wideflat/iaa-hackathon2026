[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iaa"
version = "0.1.0"
description = "IAA AI-Assisted Actuarial Hackathon 2026 - pricing models, validation harness and guardrails"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas>=2.2",
    "pyarrow",
    "scikit-learn",
    "lightgbm",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
